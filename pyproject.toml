[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mshub"
version = "1.3.3"
description = "Local agent skill repository manager and distribution hub"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dunnnwei" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
gui = ["pywebview>=5.2,<7"]
native = ["PySide6>=6.8,<7"]
keyring = ["keyring>=25,<27"]
release = ["pyinstaller>=6.16,<7"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
mshub = "mshub.cli:app"
123mshub = "mshub.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mshub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
