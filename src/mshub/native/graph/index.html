<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>123 MSHub · 记忆图示</title>
    <script type="module" crossorigin src="./assets/index-DjgSGntN.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-s91aAcoq.css">
  </head>
  <body data-theme="light">
    <main class="graph-shell">
      <header class="heading">
        <div>
          <span class="eyebrow">OBSIDIAN GRAPH VIEW</span>
          <h1>记忆图示</h1>
          <p>双链关系在画布上自然展开；悬停节点查看一度关联，滚轮缩放，拖动节点整理空间。</p>
        </div>
        <div class="stats"><strong id="node-count">0</strong><span>节点</span><strong id="edge-count">0</strong><span>关系</span></div>
      </header>
      <div class="toolbar">
        <label class="search"><span>⌕</span><input id="query" placeholder="搜索标题、条目名、标签" aria-label="搜索图谱" /><button id="clear" aria-label="清除搜索">×</button></label>
        <button id="refresh">刷新</button>
        <button id="reset">复位</button>
        <label class="tag-toggle"><input id="include-tags" type="checkbox" /> 共同标签边</label>
        <button id="settings-toggle" aria-expanded="false">设置</button>
      </div>
      <aside id="graph-settings" class="graph-settings" hidden>
        <h2>图谱设置</h2>
        <section><h3>Filters</h3><label><input data-type="user" type="checkbox" checked /> 用户</label><label><input data-type="project" type="checkbox" checked /> 项目</label><label><input data-type="reference" type="checkbox" checked /> 参考</label><label><input data-type="feedback" type="checkbox" checked /> 反馈</label><label><input id="show-orphans" type="checkbox" checked /> 显示孤儿节点</label><label><input id="motion-toggle" type="checkbox" checked /> 闲置微动</label></section>
        <section><h3>Display</h3><label><span>节点尺寸</span><input data-setting="nodeScale" type="range" min="0.6" max="1.8" step="0.1" value="1" /><output>1</output></label><label><span>标签阈值</span><input data-setting="labelThreshold" type="range" min="2" max="18" step="1" value="8" /><output>8</output></label></section>
        <section><h3>Forces</h3><label><span>中心力</span><input data-setting="forces.center" type="range" min="0.1" max="4" step="0.1" value="1" /><output>1</output></label><label><span>斥力</span><input data-setting="forces.repel" type="range" min="20" max="220" step="10" value="100" /><output>100</output></label><label><span>弹簧</span><input data-setting="forces.link" type="range" min="0" max="2" step="0.1" value="1" /><output>1</output></label><label><span>连接距离</span><input data-setting="forces.distance" type="range" min="40" max="160" step="10" value="80" /><output>80</output></label></section>
      </aside>
      <section id="surface" class="surface" aria-label="记忆关系图">
        <div id="sigma-container" class="sigma-container"></div>
        <div id="message" class="message">正在读取记忆关系…</div>
        <div id="tooltip" class="tooltip" hidden></div>
        <div class="zoom-controls"><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">－</button></div>
        <div class="legend"><span><i class="user"></i>用户</span><span><i class="project"></i>项目</span><span><i class="reference"></i>参考</span><span><i class="feedback"></i>反馈</span></div>
      </section>
    </main>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  </body>
</html>
